<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grok Bot 交易终端</title>
  <link rel="icon" href="favicon.svg">
  <link rel="stylesheet" href="css/terminal.css">
  <script src="js/lightweight-charts.standalone.production.js"></script>
</head>
<body>
  <header>
    <div class="top">
      <h1>Grok Bot 交易终端</h1>
      <div>
        <span class="badge">模拟盘 · 不是真钱</span>
        <a href="report.html">详细报告</a>
        <a href="https://donglee1021.github.io/crypto-dashboard/">实时看板</a>
      </div>
    </div>
    <div class="stats" id="stats"></div>
  </header>
  <main>
    <p class="warn" id="honesty"></p>
    <div class="layout">
      <section class="card" id="agents"></section>
      <section>
        <div class="card">
          <h3>这一轮</h3>
          <div class="flow" id="flow"></div>
          <div class="trade" id="trade"></div>
        </div>
        <div class="card" style="margin-top:12px">
          <h3>结果</h3>
          <div class="result" id="result"></div>
          <div id="eqChart" class="chart"></div>
        </div>
        <div class="card" style="margin-top:12px">
          <h3>决定记录</h3>
          <div class="log" id="log"></div>
        </div>
        <div class="card help" style="margin-top:12px" id="help">
          <h3>怎么看</h3>
          <p>左边是六个步骤：先看信号，再检查要不要拦住，然后按固定模拟规则算一张很小的账，最后只在账本上记下开仓或平仓。</p>
          <p>中间的流程会标出这一轮停在哪一步。有持仓时，价格用浏览器向 OKX 要的最新价，两次任务之间的浮动盈亏会跟着变。</p>
          <p>下面每条记录都有维也纳时间、动作和一句人话原因。过滤就是没做，跳过就是这一轮没有新动作。</p>
          <p>任务大约每 15 分钟跑一次，GitHub 的定时可能晚几分钟。过去的回测没有好过买入持有，这里的模拟盘也不保证以后会赚。</p>
        </div>
      </section>
    </div>
  </main>
  <script src="js/terminal.js"></script>
</body>
</html>
