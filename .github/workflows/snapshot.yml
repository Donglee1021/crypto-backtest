name: 记录信号快照

on:
  schedule:
    # 每小时第 8 分钟。调度用 Actions cron，不使用 APScheduler。
    - cron: "8 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: crypto-backtest-data
  cancel-in-progress: false

jobs:
  snapshot:
    outputs:
      pages: ${{ steps.pagescfg.outcome }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 检出
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: true

      - name: 取回 data 分支上的历史库
        run: |
          git fetch origin data || true
          if git rev-parse --verify origin/data >/dev/null 2>&1; then
            git checkout origin/data -- data/cache data/history.duckdb data/history || true
            git reset -q HEAD -- data/cache data/history.duckdb data/history || true
          fi

      - name: 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装分析依赖
        run: bash scripts/install_analysis.sh

      - name: 对照浏览器打分
        run: python3 analysis/parity_check.py

      - name: 写入当前信号
        run: python3 -u -m analysis.run_snapshot

      - name: 提交信号
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/backtest/signals.json data/backtest/latest.json data/backtest/exit_live.json
          if git diff --cached --quiet; then
            echo "信号无变化"
          else
            git commit -m "data: 记录信号快照"
            ok=false
            for i in 1 2 3 4; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                ok=true
                break
              fi
              sleep $((i * 5))
            done
            if [ "$ok" != true ]; then
              echo "推送 main 失败"
              exit 1
            fi
          fi

      - name: 更新 data 分支
        run: bash scripts/push_data_branch.sh

      - name: 组装站点
        run: bash scripts/assemble_site.sh

      - name: 配置 Pages
        id: pagescfg
        continue-on-error: true
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: 上传页面
        if: steps.pagescfg.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Pages 未开启时说明原因
        if: steps.pagescfg.outcome != 'success'
        run: echo "::warning::GitHub Pages 未能在这个任务里配置。请仓库所有者打开 Settings → Pages → Build and deployment → Source，选 GitHub Actions 并保存，然后重新运行「部署页面」。"

  deploy:
    needs: snapshot
    if: needs.snapshot.result == 'success' && needs.snapshot.outputs.pages == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v5
